[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-assistant"
version = "0.1.0"
description = "Instrumented, evaluated RAG assistant over the FastAPI documentation"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "langchain-core>=1.0",
    "langchain>=1.0",                  # init_chat_model: provider-agnostic judge model
    "langchain-openai>=1.0",
    "langchain-chroma>=1.0",
    "langchain-classic>=1.0",          # SQLRecordManager for incremental indexing
    "sqlalchemy[asyncio]>=2.0",        # required by SQLRecordManager
    "flashrank>=0.2.10",               # local cross-encoder reranker (Phase 1); model downloads on first use
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Only for the regression test showing why the built-in
    # MarkdownHeaderTextSplitter isn't used.
    "langchain-text-splitters>=1.0",
]
# Third-party RAG metrics and question generation (docs_assistant.ragas_eval / ragas_testset).
# The pins matter: without them pip resolves an old `instructor` that downgrades
# langchain-openai and the openai SDK, and langchain-community 0.4.2 removed a
# module Ragas 0.4.3 imports.
ragas = [
    "ragas==0.4.3",
    "instructor>=1.11",
    "langchain-community==0.4.1",
    "langchain-openai>=1.6.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # Raised inside chromadb because LangChain supplies the embedding function,
    # not Chroma. Harmless.
    "ignore:legacy embedding function config:DeprecationWarning",
]
